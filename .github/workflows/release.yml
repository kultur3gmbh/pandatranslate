name: Verify and build PandaTranslate
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, sodium, openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: bash tools/check.sh
      - run: python3 tools/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pandatranslate-package
          path: dist/*
          if-no-files-found: error
      - name: Publish reviewed tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "PandaTranslate ${GITHUB_REF_NAME#v}" --notes-file readme.txt --latest
